version: 3

includes:
  shared:
    taskfile: hack/common/Taskfile_controller.yaml
    flatten: true
    excludes: [ ] # put task names in here which are overwritten in this file
    vars:
      CODE_DIRS: '{{.ROOT_DIR}}/cmd/... {{.ROOT_DIR}}/pkg/... {{.ROOT_DIR}}/integration-test/...'
      COMPONENTS: landscapercli
      REPO_URL: 'https://github.com/openmcp-project/landscapercli'
      GENERATE_DOCS_INDEX: "false"
      CHART_COMPONENTS: "[]"
  common: # imported a second time so that overwriting task definitions can call the overwritten task with a 'c:' prefix
    taskfile: hack/common/Taskfile_controller.yaml
    internal: true
    aliases:
    - c
    vars:
      CODE_DIRS: '{{.ROOT_DIR}}/cmd/... {{.ROOT_DIR}}/pkg/... {{.ROOT_DIR}}/integration-test/...'
      COMPONENTS: landscapercli
      REPO_URL: 'https://github.com/openmcp-project/landscapercli'
      GENERATE_DOCS_INDEX: "false"
      CHART_COMPONENTS: "[]"

# Makefile target mapping:
#   help            -> 'help' task (shared)
#   revendor        -> 'generate:tidy' task (shared, also called by 'generate')
#   format          -> 'generate:format' task (shared, also called by 'generate')
#   check / verify  -> 'validate' / 'verify' / 'check' tasks (shared)
#   test            -> 'test' task (shared)
#   cross-build     -> 'build' task (shared: build:bin:all, multi-platform linux+darwin x amd64+arm64)
#   component       -> 'ocm' task (shared: build:ocm:all, builds and pushes OCM component)
#   component-build -> 'build:ocm:build' task (shared)
#   component-push  -> 'build:ocm:push' task (shared)
#   localbin        -> 'tools:localbin' internal task (shared)
#   goimports       -> 'tools:goimports' internal task (shared)
#   golangci-lint   -> 'tools:golangci-lint' internal task (shared)
#   ocm (tool)      -> 'tools:ocm' internal task (shared)

tasks:

  # Makefile 'generate': generates command reference documentation.
  # The shared 'generate' task covers tidy/format/code-gen but skips command-reference
  # because Taskfile_controller.yaml does not set IS_CLI=true (only Taskfile_cli.yaml does).
  generate-docs:
    desc: "  Generate the command reference documentation."
    aliases:
    - cmdref
    cmds:
    - 'go run "{{.ROOT_DIR}}/hack/generate-docs/main.go" "{{.ROOT_DIR}}/docs/reference"'

  # Makefile 'install' / 'install-cli': installs the CLI tool.
  # Not available in Taskfile_controller.yaml (only in Taskfile_cli.yaml).
  # Uses pkg/version (not internal/version) for version ldflags.
  install:
    desc: "  Install the landscapercli CLI tool."
    aliases:
    - install-cli
    cmds:
    - |
      CGO_ENABLED=0 go install \
        -ldflags "-X github.com/openmcp-project/landscapercli/pkg/version.LandscaperCliVersion={{.VERSION}} \
                  -X github.com/openmcp-project/landscapercli/pkg/version.gitTreeState={{.GIT_TREE_STATE}} \
                  -X github.com/openmcp-project/landscapercli/pkg/version.gitCommit={{.GIT_COMMIT}}" \
        {{.ROOT_DIR}}/cmd/landscapercli

  dev_integration_test:
    desc: "  Run integration tests against a Gardener shoot cluster."
    cmds:
    - |
      set -euo pipefail

      # Parse --target-clustername from CLI args
      TARGET_CLUSTER=""
      for arg in {{.CLI_ARGS}}; do
        case "$arg" in
          --target-clustername=*|-target-clustername=*|TARGET_CLUSTERNAME=*)
            TARGET_CLUSTER="${arg#*=}"
            ;;
        esac
      done
      if [ -z "$TARGET_CLUSTER" ]; then
        echo "Required parameter: --target-clustername"
        exit 1
      fi

      # Install helm if not available
      if ! command -v helm &>/dev/null; then
        echo "Installing helm..."
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
      HELM_BIN="$(command -v helm)"
      ln -sf "$HELM_BIN" /usr/local/bin/helm3 2>/dev/null || true
      export HELM_EXECUTABLE="$HELM_BIN"

      # Install kubectl if not available
      if ! command -v kubectl &>/dev/null; then
        echo "Installing kubectl..."
        KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
        curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        install -m 0755 kubectl /usr/local/bin/kubectl
        rm kubectl
      fi

      # Decode garden kubeconfig from env var
      GARDEN_KUBECONFIG="$(mktemp)"
      trap 'rm -f "$GARDEN_KUBECONFIG"' EXIT

      if [ -n "${GARDEN_KUBE_CONFIG_B64:-}" ]; then
        printf '%s' "$GARDEN_KUBE_CONFIG_B64" | base64 -d > "$GARDEN_KUBECONFIG"
      elif [ -n "${GARDEN_KUBE_CONFIG:-}" ]; then
        printf '%s' "$GARDEN_KUBE_CONFIG" > "$GARDEN_KUBECONFIG"
      else
        echo "Required env var: GARDEN_KUBE_CONFIG_B64 (base64-encoded) or GARDEN_KUBE_CONFIG (raw YAML)"
        exit 1
      fi

      # Request shoot admin kubeconfig via Gardener API
      GARDEN_NAMESPACE="garden-laas"
      EXPIRATION_SECONDS=86400
      echo "Getting admin kubeconfig for shoot '${TARGET_CLUSTER}' in namespace '${GARDEN_NAMESPACE}'"

      ADMIN_KUBECONFIG_JSON="$(kubectl create \
        --kubeconfig="$GARDEN_KUBECONFIG" \
        --raw "/apis/core.gardener.cloud/v1beta1/namespaces/${GARDEN_NAMESPACE}/shoots/${TARGET_CLUSTER}/adminkubeconfig" \
        -f - <<EOF
      {"apiVersion":"authentication.gardener.cloud/v1alpha1","kind":"AdminKubeconfigRequest","spec":{"expirationSeconds":${EXPIRATION_SECONDS}}}
      EOF
      )"

      SHOOT_KUBECONFIG="$(mktemp)"
      trap 'rm -f "$GARDEN_KUBECONFIG" "$SHOOT_KUBECONFIG"' EXIT
      printf '%s' "$ADMIN_KUBECONFIG_JSON" | python3 -c "
      import sys, json, base64
      data = json.load(sys.stdin)
      sys.stdout.write(base64.b64decode(data['status']['kubeconfig']).decode('utf-8'))
      " > "$SHOOT_KUBECONFIG"

      # Run integration tests and save output
      OUTPUT_DIR="{{.ROOT_DIR}}/integration_test"
      mkdir -p "$OUTPUT_DIR"

      cd "{{.ROOT_DIR}}/integration-test"
      go run main.go \
        --kubeconfig "$SHOOT_KUBECONFIG" \
        --landscaper-namespace "lndscpr-int-test" \
        --test-namespace "ls-cli-inttest" \
        --max-retries 10 2>&1 | tee "$OUTPUT_DIR/out"
