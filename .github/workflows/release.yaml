name: Versioned Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write # we need this to be able to push tags
  pull-requests: read

jobs:
  release_tag:
    uses: openmcp-project/build/.github/workflows/release.lib.yaml@a5dee32e920b1dcccad29665a8dec967f3a3950b # main
    secrets: inherit
